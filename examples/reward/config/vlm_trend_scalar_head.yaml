# Train the shared ValueHead on frozen VLM potential/progress feature shards.
# Feature shards come from:
#   python examples/reward/train_vlm_trend_success_model.py --stage extract ...
#
#   export FEAT_ROOT=/path/to/vlm_trend_potential_features
#   export SCALAR_OUTPUT_ROOT=/path/to/vlm_trend_scalar_head
#   python examples/reward/train_vlm_trend_scalar_head.py

defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

feat_root: ${oc.env:FEAT_ROOT,logs/vlm_trend_potential_features}
output_dir: ${oc.env:SCALAR_OUTPUT_ROOT,logs/vlm_trend_scalar_head}

train_pattern: ${feat_root}/train_potential_rank*.pt
eval_pattern: ${feat_root}/eval_potential_rank*.pt
progress_pattern: ${feat_root}/eval_progress_rank*.pt
train_progress_pattern: ${feat_root}/train_progress_rank*.pt

device: cuda:0
seed: 42

# Same ValueHead used by PPO critics; potential scoring opts into LN + SiLU + dropout.
hidden_dim: 512
dropout: 0.1
activation: silu
use_input_norm: true
bias_last: true

batch_size: 256
eval_batch_size: 1024
epochs: 100
eval_interval: 5
lr: 3.0e-4
weight_decay: 1.0e-3
rank_weight: 0.2
rank_min_gap: 0.1
delta_weight: 10.0
delta_beta: 0.03
local_rank_weight: 0.2
local_rank_min_gap: 0.01
progress_deadband: 0.03

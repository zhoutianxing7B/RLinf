defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: ${oc.env:REWARD_TRAIN_GPU_PLACEMENT,0-0}

runner:
  task_type: sft
  logger:
    log_path: "logs/shared_semantic_reward"
    project_name: rlinf
    experiment_name: "shared_semantic_reward_training"
    logger_backends: ["tensorboard"]
  max_epochs: ${oc.decode:${oc.env:REWARD_MAX_EPOCHS,100}}
  max_steps: ${oc.decode:${oc.env:REWARD_MAX_STEPS,-1}}
  val_check_interval: ${oc.decode:${oc.env:REWARD_VAL_INTERVAL,50}}
  save_interval: ${oc.decode:${oc.env:REWARD_SAVE_INTERVAL,50}}
  early_stop:
    enabled: true
    patience: 10
    min_delta: 0.001
    monitor: "val_loss"

data:
  dataset_type: shared_semantic_rollout
  train_data_paths: ${oc.env:SHARED_REWARD_TRAIN_MANIFEST}
  val_data_paths: ${oc.env:SHARED_REWARD_VAL_MANIFEST}
  dataset_kwargs:
    history_size: ${oc.decode:${oc.env:SEMANTIC_REWARD_HISTORY,4}}
    samples_per_episode: ${oc.decode:${oc.env:REWARD_SAMPLES_PER_EPISODE,14}}
    positive_samples_per_episode: ${oc.decode:${oc.env:REWARD_POSITIVE_SAMPLES_PER_EPISODE,7}}
    hard_negative_tail: ${oc.decode:${oc.env:REWARD_HARD_NEGATIVE_TAIL,8}}
    delay_min_frames: ${oc.decode:${oc.env:REWARD_DELAY_MIN_FRAMES,0}}
    delay_max_frames: ${oc.decode:${oc.env:REWARD_DELAY_MAX_FRAMES,0}}
    control_hz: ${oc.decode:${oc.env:SEMANTIC_CONTROL_HZ,20.0}}
    state_dim: 132
    action_history_length: ${oc.decode:${oc.env:ACTION_HISTORY_LENGTH,4}}
    action_dim: 132
  num_workers: ${oc.decode:${oc.env:REWARD_DATA_WORKERS,4}}

actor:
  group_name: "RewardActorGroup"
  training_backend: "fsdp"
  micro_batch_size: ${oc.decode:${oc.env:REWARD_MICRO_BATCH_SIZE,16}}
  global_batch_size: ${oc.decode:${oc.env:REWARD_GLOBAL_BATCH_SIZE,64}}
  seed: 42
  enable_offload: false
  model:
    model_type: "shared_semantic_temporal"
    model_path: null
    require_checkpoint: false
    precision: "bf16"
    history_size: ${oc.decode:${oc.env:SEMANTIC_REWARD_HISTORY,4}}
    history_buffer_name: "semantic_window"
    token_dim: 2048
    adapter_dim: 256
    temporal_dim: 256
    task_dim: 64
    num_tasks: 10
    state_dim: 132
    action_history_length: ${oc.decode:${oc.env:ACTION_HISTORY_LENGTH,4}}
    action_dim: 132
    num_embodiments: 32
    require_action_condition: ${oc.decode:${oc.env:REWARD_REQUIRE_ACTION_CONDITION,true}}
    age_hidden_dim: 64
    age_normalization_frames: 8
    age_normalization_s: 0.4
    head_hidden_dim: 128
    # The imported hzp collector supplies factual temporal-success labels.
    # Progress/failure heads remain present for later supervision but must not
    # contribute random, untrained values to the initial reward.
    progress_weight: 0.0
    completion_weight: 1.0
    completion_pos_weight: ${oc.decode:${oc.env:REWARD_POS_WEIGHT,3.0}}
    failure_weight: 0.0
    uncertainty_penalty: 0.0
    uncertainty_loss_weight: 0.0
    interval_reward: 0.0
    add_value_head: false
    is_lora: false
    freeze_vit: false
    use_flash_attention: false
  optim:
    lr: ${oc.decode:${oc.env:REWARD_LR,1.0e-4}}
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_warmup_steps: 100
    warmup_style: "constant"
    total_training_steps: 10000
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: "bf16"
      reduce_dtype: "bf16"
      buffer_dtype: "bf16"

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "${oc.env:ENPIRE_RUN_ROOT,../results}"
    project_name: rlinf
    experiment_name: "libero_spatial_task9_enpire_sac"
    logger_backends: ["tensorboard"]
  max_epochs: 100
  max_steps: 100
  only_eval: false
  val_check_interval: 5
  save_interval: 5
  weight_sync_interval: 1

algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 64
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.1
    target_entropy: -56
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 20
    sample_window_size: 20
    min_buffer_size: 1
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  filter_rewards: false

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: false
    ignore_terminations: true
    use_rel_reward: false
    use_step_penalty: false
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    init_params:
      camera_heights: 128
      camera_widths: 128
    specific_reset_id: null
    task_id_filter: [9]
    use_fixed_reset_state_ids: false
    use_ordered_reset_state_ids: false
    video_cfg:
      save_video: false
    agentic_reward:
      enabled: true
      program_path: "${oc.env:ENPIRE_PROGRAM_PATH,examples/agentic_reward/programs/libero_spatial_task9_seed.json}"
      gamma: ${algorithm.gamma}
      reload_interval_steps: 16
  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: false
    use_step_penalty: false
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    init_params:
      camera_heights: 128
      camera_widths: 128
    specific_reset_id: null
    task_id_filter: [9]
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    is_eval: true
    group_size: 1
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  enable_torch_compile: false
  model:
    model_path: "${oc.env:RLINF_RESNET_MODEL_PATH,/vepfs-mlp2/c20250301/240403026/agentic_vla/RLinf/outputs/checkpoints/RLinf-ResNet10-pretrained}"
    model_type: cnn_policy
    precision: "32"
    policy_setup: libero
    image_size: [3, 128, 128]
    image_num: 2
    state_dim: 8
    action_dim: 7
    num_action_chunks: 8

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 512
  seed: 20260904
  enable_offload: false
  model:
    model_path: "${oc.env:RLINF_RESNET_MODEL_PATH,/vepfs-mlp2/c20250301/240403026/agentic_vla/RLinf/outputs/checkpoints/RLinf-ResNet10-pretrained}"
    model_type: cnn_policy
    precision: "32"
    policy_setup: libero
    image_size: [3, 128, 128]
    image_num: 2
    state_dim: 8
    action_dim: 7
    num_action_chunks: 8
    add_value_head: false
    add_q_head: true
    q_head_type: default
    warmup_checkpoint: "${oc.env:ENPIRE_WARMUP_CHECKPOINT,''}"
    warmup_action_std: 0.05
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

agentic_reward:
  enabled: true
  evolution_interval: 5
  controller:
    program_path: "${env.train.agentic_reward.program_path}"
    scene_context_path: "examples/agentic_reward/scenes/libero_spatial_task9.json"
    audit_dir: "${oc.env:ENPIRE_AUDIT_DIR,${runner.logger.log_path}/${runner.logger.experiment_name}/agentic_audit}"
    gamma: ${algorithm.gamma}
    score_keys: []
    score_panels:
      reset_panel_a: {numerator: "eval/panel_a_success_mass", denominator: "eval/panel_a_mass"}
      reset_panel_b: {numerator: "eval/panel_b_success_mass", denominator: "eval/panel_b_mass"}
    target_score: 0.7
    min_improvement: 0.02
    regression_tolerance: 0.02
    baseline_warmup_evaluations: 4
    candidate_patience_evaluations: 4
    manager:
      base_url: "https://maimai.it.com"
      model: "gpt-5.6-luna"
      api_key_env: AGENTIC_MODEL_API_KEY
      timeout_seconds: 180
      max_retries: 3

reward:
  use_reward_model: false

critic:
  use_critic_model: false

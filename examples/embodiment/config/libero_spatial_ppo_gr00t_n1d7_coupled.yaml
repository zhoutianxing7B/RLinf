defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: ${oc.env:ACTOR_GPU_PLACEMENT,1-3}
    rollout: ${oc.env:ROLLOUT_GPU_PLACEMENT,1-3}
    env: ${oc.env:ENV_GPU_PLACEMENT,1-3}

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: ${oc.env:PPO_EXPERIMENT_NAME,libero_spatial_ppo_gr00t_n1d7_coupled}
    logger_backends: ["tensorboard"]

  max_epochs: 2000
  max_steps: -1

  only_eval: False
  val_check_interval: 20
  save_interval: 200

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 8
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: True
  eval:
    total_num_envs: 8
    group_size: 1
    auto_reset: True
    ignore_terminations: True # False for evaluation
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    is_eval: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_type: ${actor.model.model_type}
    trust_remote_code: ${actor.model.trust_remote_code}
    is_lora: ${actor.model.is_lora}
    action_dim: ${actor.model.action_dim}
    obs_converter_type: ${actor.model.obs_converter_type}
    embodiment_tag: ${actor.model.embodiment_tag}
    add_value_head: ${actor.model.add_value_head}
    model_path: ${oc.env:GR00T_MODEL_PATH}
    backbone_model_path: ${oc.env:GR00T_BACKBONE_PATH}
    precision: ${actor.model.precision}
    num_action_chunks: ${actor.model.num_action_chunks}
    denoising_steps: ${actor.model.denoising_steps}
    num_steps: ${actor.model.num_steps}
    rl_head_config: ${actor.model.rl_head_config}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 32
  seed: 1234
  enable_offload: True

  model:
    model_type: "gr00t_n1d7"
    model_path: ${oc.env:GR00T_MODEL_PATH}
    backbone_model_path: ${oc.env:GR00T_BACKBONE_PATH}
    embodiment_tag: "libero_sim" # N1.7 change this value from libero_panda to libero_sim
    add_value_head: True
    # Match Isaac-GR00T validated LIBERO rollout defaults.
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      execution_mode: coupled
      semantic_server_enabled: false
      drop_local_backbone: false
      dit_only_train: false

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: True
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

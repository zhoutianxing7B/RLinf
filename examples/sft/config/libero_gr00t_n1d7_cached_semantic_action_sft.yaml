defaults:
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: ${oc.env:ACTION_SFT_GPU_PLACEMENT,0-3}

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: ${oc.env:ACTION_SFT_EXPERIMENT_NAME,libero_gr00t_n1d7_cached_semantic_action_sft}
    logger_backends: ["tensorboard"]
  max_epochs: ${oc.decode:${oc.env:ACTION_SFT_MAX_EPOCHS,20}}
  max_steps: ${oc.decode:${oc.env:ACTION_SFT_MAX_STEPS,-1}}
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:ACTION_SFT_SAVE_INTERVAL,500}}
  resume_dir: ${oc.decode:${oc.env:ACTION_SFT_RESUME_DIR,null}}

data:
  dataset_type: shared_semantic_action
  train_data_paths: ${oc.env:SHARED_ACTION_TRAIN_DATA}
  val_data_paths: null
  num_workers: ${oc.decode:${oc.env:ACTION_SFT_DATA_WORKERS,4}}
  pin_memory: true

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: ${oc.decode:${oc.env:ACTION_SFT_MICRO_BATCH_SIZE,2}}
  global_batch_size: ${oc.decode:${oc.env:ACTION_SFT_GLOBAL_BATCH_SIZE,128}}
  seed: 1234
  enable_offload: false
  model:
    model_path: ${oc.env:GR00T_MODEL_PATH}
    backbone_model_path: ${oc.env:GR00T_BACKBONE_PATH}
    precision: "bf16"
    add_value_head: false
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      add_value_head: false
      joint_logprob: false
      noise_method: "flow_sde"
      noise_level: 0.5
      disable_dropout: true
      padding_value: 570
      semantic_server_enabled: true
      drop_local_backbone: true
      require_packet_age_input: true
      initialize_packet_age_adapter: true
      initialize_action_history_length: ${oc.decode:${oc.env:ACTION_HISTORY_LENGTH,6}}
      zero_init_new_delay_adapters: true
      semantic_stale_adapter_enabled: true
      semantic_stale_adapter_threshold_frames: 0
      semantic_control_hz: 20.0
      dit_only_train: true
      trainable_modules:
        - "action_head.model"
        - "action_head.packet_age_adapter"
        - "action_head.action_history_adapter"
        - "action_head.stale_semantic_token_adapter"
  optim:
    lr: ${oc.decode:${oc.env:ACTION_SFT_LR,1.0e-5}}
    value_lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-4
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: ${oc.decode:${oc.env:ACTION_SFT_WARMUP_STEPS,100}}
    total_training_steps: ${oc.decode:${oc.env:ACTION_SFT_TOTAL_STEPS,5000}}
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: true
    save_full_model_weights: true
    mixed_precision:
      param_dtype: "bf16"
      reduce_dtype: "bf16"
      buffer_dtype: "bf16"
